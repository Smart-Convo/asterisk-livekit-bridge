; FreePBX custom context for the parallel Asterisk -> LiveKit test path.
; The FreePBX custom device dials Local/s@lkbridge-inbound/n.
[lkbridge-inbound]
exten => s,1,NoOp(Asterisk LiveKit bridge: caller=${CALLERID(num)} linkedid=${CHANNEL(linkedid)})
 same => n,Set(__ASTERISK_UNIQUEID=${UNIQUEID})
 same => n,Set(__ASTERISK_LINKEDID=${CHANNEL(linkedid)})
 same => n,Set(__CALL_HUMAN_NUMBER=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(__CALL_AGENT_NUMBER=924232460261)
 same => n,Set(__CALLER_NUMBER=${CALLERID(num)})
 same => n,Set(__CALLEE_NUMBER=924232460261)
 same => n,Set(__CALL_TRACE_ID=${CHANNEL(linkedid)})
 same => n,Dial(WebSocket/lkbridge/c(slin)nf(json)v(asterisk_uniqueid=${URIENCODE(${ASTERISK_UNIQUEID})},asterisk_linkedid=${URIENCODE(${ASTERISK_LINKEDID})},call_human_number=${URIENCODE(${CALL_HUMAN_NUMBER})},call_agent_number=${URIENCODE(${CALL_AGENT_NUMBER})},caller_number=${URIENCODE(${CALLER_NUMBER})},callee_number=${URIENCODE(${CALLEE_NUMBER})},call_trace_id=${URIENCODE(${CALL_TRACE_ID})}),120)
 same => n,Hangup()
